[package]
name = "chatbot"
version = "0.1.0"
authors = ["Clomance"]
edition = "2021"



[profile.dev]
opt-level = 0
lto = false

[profile.release]
opt-level = 3
lto = true


[dependencies]
url = "2.3.1"
serde_json = "1.0.89"
futures = "0.3.25"
rand = "0.8.5"
chrono = "0.4.23"
teloxide-core = "0.9.1"
tokio-postgres = "0.7.8"

[dependencies.tokio]
version = "1.23.0"
features = ["full"]

[dependencies.attohttpc]
version = "0.24.0"
features = ["json", "multipart-form"]

[dependencies.postgres-openssl]
version = "0.5.0"

[dependencies.openssl]
version = "0.10.44"